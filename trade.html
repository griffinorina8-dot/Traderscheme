<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraderScheme - Demo Trading</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 20px;
      background: #151c32;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #151c32;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .balance {
      font-size: 30px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #444;
      background: #0d1325;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .buy {
      background: #20c997;
      color: white;
    }

    .sell {
      background: #dc3545;
      color: white;
    }

    .demo {
      background: #6c63ff;
      color: white;
    }

    .logout {
      background: #444;
      color: white;
    }

    .notice {
      color: #ffc107;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>TraderScheme</h1>
  <div>Demo Trading Account</div>
</header>

<div class="container">

  <div class="card">
    <p>Demo Balance</p>
    <div class="balance">$<span id="balance">10000.00</span></div>
    <p class="notice">Demo funds only — no real money is being deposited.</p>
  </div>

  <div class="card">
    <h2>Trade</h2>

    <input id="amount" type="number"
           placeholder="Trade amount"
           min="1">

    <button class="buy" onclick="buy()">BUY</button>
    <button class="sell" onclick="sell()">SELL</button>
  </div>

  <div class="card">
    <h2>Demo Wallet</h2>

    <button class="demo" onclick="demoDeposit()">
      Demo Deposit
    </button>

    <button class="demo" onclick="demoWithdraw()">
      Demo Withdraw
    </button>
  </div>

  <div class="card">
    <h2>Activity</h2>
    <div id="history">No trades yet.</div>
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>

<script>

let balance = Number(localStorage.getItem("demoBalance")) || 10000;

function displayBalance() {
  document.getElementById("balance").textContent =
    balance.toFixed(2);

  localStorage.setItem("demoBalance", balance);
}

function getAmount() {
  return Number(document.getElementById("amount").value);
}

function buy() {

  const amount = getAmount();

  if (!amount || amount <= 0) {
    alert("Enter a valid trade amount.");
    return;
  }

  if (amount > balance) {
    alert("Insufficient demo balance.");
    return;
  }

  balance -= amount;

  document.getElementById("history").innerHTML =
    "BUY order placed: $" + amount.toFixed(2);

  displayBalance();
}

function sell() {

  const amount = getAmount();

  if (!amount || amount <= 0) {
    alert("Enter a valid trade amount.");
    return;
  }

  balance += amount;

  document.getElementById("history").innerHTML =
    "SELL order placed: $" + amount.toFixed(2);

  displayBalance();
}

function demoDeposit() {

  balance += 1000;

  document.getElementById("history").innerHTML =
    "Demo deposit: +$1,000.00";

  displayBalance();
}

function demoWithdraw() {

  if (balance < 100) {
    alert("Minimum demo withdrawal is $100.");
    return;
  }

  balance -= 100;

  document.getElementById("history").innerHTML =
    "Demo withdrawal: -$100.00";

  displayBalance();
}

function logout() {
  window.location.href = "login.html";
}

displayBalance();

</script>

</body>
</html>
